<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#261e16" />
    <title>MURMUR</title>
    <script>
      (function(){
        var p='auto';
        try{p=localStorage.getItem('murmur.theme.v1')||'auto'}catch(e){}
        var t=p;
        if(p==='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
        document.documentElement.setAttribute('data-theme',t);
        document.documentElement.style.colorScheme=t;
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/icons/murmur-favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/murmur-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/murmur-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/murmur-apple-touch-180.png" />

</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
