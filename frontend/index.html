<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#261e16" />
    <title>MURMUR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function(){
        var p='auto';
        try{p=localStorage.getItem('taccan.theme.v1')||'auto'}catch(e){}
        var t=p;
        if(p==='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
        document.documentElement.setAttribute('data-theme',t);
        document.documentElement.style.colorScheme=t;
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/icons/murmur-favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/murmur-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/murmur-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/murmur-apple-touch-180.png" />

</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
