<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/taccan/" />
    <meta name="theme-color" content="#261e16" />
    <title>TACCAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700;900&family=Special+Elite&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="sr-announcements" class="sr-only" aria-live="assertive" role="log"></div>

    <main class="app-shell">
      <!-- JOIN SCREEN -->
      <section id="join-panel" class="join-screen">
        <div class="join-card">
          <div class="dossier-stamp" aria-hidden="true">CLASSIFIED</div>
          <div class="fold-line fold-line-h" aria-hidden="true"></div>
          <div class="fold-line fold-line-v" aria-hidden="true"></div>

          <header class="join-header">
            <div class="document-number" aria-hidden="true">DOC. NO. TC-4782</div>
            <h1 class="logo-title">TACCAN</h1>
            <div class="logo-rule" aria-hidden="true"></div>
            <p class="join-subtitle" data-i18n="join_subtitle">Create a private table or join one with a 4-letter code.</p>
          </header>

          <div class="join-form">
            <label class="field-group">
              <span class="field-label" data-i18n="display_name">DISPLAY NAME</span>
              <input id="name-input" type="text" maxlength="24" placeholder="Agent Name"
                     data-i18n-placeholder="display_name_placeholder" autocomplete="off" />
            </label>

            <label class="field-group">
              <span class="field-label" data-i18n="room_code">ROOM CODE</span>
              <div class="join-row">
                <input id="code-input" type="text" maxlength="4" placeholder="ABCD"
                       data-i18n-placeholder="room_code_placeholder" autocomplete="off" class="code-field" />
                <button id="join-btn" class="btn btn-secondary" type="button" data-i18n="join_room">Join</button>
              </div>
            </label>

            <div class="join-actions">
              <button id="create-btn" class="btn btn-primary btn-lg" type="button" data-i18n="create_room">Create Room</button>
            </div>

            <p id="join-note" class="join-note" data-i18n="join_note_default">
              Use one name across tabs so your team can track you easily.
            </p>
          </div>

          <footer class="join-footer">
            <div class="language-switch" role="group" aria-label="Language">
              <button class="lang-btn" type="button" data-language="en" data-i18n="language_en">English</button>
              <button class="lang-btn" type="button" data-language="tr" data-i18n="language_tr">Türkçe</button>
            </div>
          </footer>
        </div>
      </section>

      <!-- ROOM SCREEN -->
      <section id="room-panel" class="room-screen hidden">
        <div class="game-stage">
          <div class="controls-strip">
            <section id="hint-section" class="ctrl-panel hint-ctrl hidden">
              <div class="ctrl-head">
                <h3 data-i18n="spymaster_hint">Spymaster Hint</h3>
                <span id="hint-status" class="ctrl-status"></span>
              </div>
              <form id="hint-form" class="hint-form">
                <input id="hint-word-input" type="text" maxlength="30" placeholder="One word"
                       data-i18n-placeholder="one_word" required autocomplete="off" />
                <input id="hint-count-input" type="number" min="0" max="9" value="1" required />
                <button type="submit" class="btn btn-primary" data-i18n="transmit">Transmit</button>
              </form>
            </section>

            <section id="guess-section" class="ctrl-panel guess-ctrl hidden">
              <p id="hint-display" class="hint-display-bar"></p>
              <p id="guess-note" class="ctrl-status"></p>
              <div class="guess-row">
                <span id="selected-guess" class="selected-label">No card selected</span>
                <button id="submit-guess-btn" class="btn btn-primary" type="button" data-i18n="submit_guess">Guess</button>
                <button id="end-turn-btn" class="btn btn-ghost" type="button" data-i18n="end_turn">End Turn</button>
              </div>
            </section>

            <section id="result-section" class="ctrl-panel result-ctrl hidden">
              <p id="result-text" class="result-text"></p>
              <div class="result-actions">
                <button id="rematch-btn" class="btn btn-primary" type="button" data-i18n="rematch">Rematch</button>
                <button id="swap-rematch-btn" class="btn btn-secondary" type="button" data-i18n="swap_rematch">Swap + Rematch</button>
                <button id="gg-btn" class="btn btn-ghost hidden" type="button" data-i18n="gg">GG</button>
                <button id="debrief-btn" class="btn btn-ghost hidden" type="button" data-i18n="debrief">Debrief</button>
              </div>
              <div id="mvp-section" class="mvp-section hidden"></div>
            </section>
          </div>

          <div class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="Game board"></div>
          </div>

          <div id="scratchpad" class="scratchpad hidden">
            <textarea id="scratchpad-textarea" placeholder="Spymaster notes..." data-i18n-placeholder="scratchpad_notes_placeholder" rows="2"></textarea>
          </div>
        </div>

        <div class="bottom-bar">
          <div class="bar-info">
            <span id="red-count" class="score-pill red">-</span>
            <span id="blue-count" class="score-pill blue">-</span>
            <div id="turn-banner" class="turn-banner" aria-live="polite">Lobby open</div>
            <div id="phase-timer" class="phase-timer hidden" aria-live="polite">
              <span id="phase-timer-label" class="timer-label"></span>
              <span id="phase-timer-value" class="timer-value">00:00</span>
            </div>
          </div>

          <nav class="bar-tabs" aria-label="Panels">
            <button class="bar-tab" data-panel="teams" type="button">
              <span class="bar-tab-icon" aria-hidden="true">&#9776;</span>
              <span class="bar-tab-label" data-i18n="panel_teams">Teams</span>
            </button>
            <button class="bar-tab" data-panel="feed" type="button">
              <span class="bar-tab-icon" aria-hidden="true">&#9993;</span>
              <span class="bar-tab-label" data-i18n="panel_feed">Feed</span>
            </button>
            <button class="bar-tab" data-panel="voice" type="button">
              <span class="bar-tab-icon" aria-hidden="true">&#9834;</span>
              <span class="bar-tab-label" data-i18n="panel_voice">Voice</span>
            </button>
            <button class="bar-tab" data-panel="settings" type="button">
              <span class="bar-tab-icon" aria-hidden="true">&#9881;</span>
              <span class="bar-tab-label" data-i18n="panel_settings">Settings</span>
            </button>
            <button class="bar-tab hidden" id="debrief-tab" data-panel="debrief" type="button">
              <span class="bar-tab-icon" aria-hidden="true">&#9998;</span>
              <span class="bar-tab-label" data-i18n="debrief">Debrief</span>
            </button>
          </nav>

          <div class="bar-util">
            <span id="room-code" class="room-code-val" title="Click to copy">----</span>
            <span id="mode-badge" class="mode-tag">Casual</span>
            <span id="connection-dot" class="conn-dot offline"></span>
            <button id="leave-room-btn" class="bar-icon-btn" type="button" aria-label="Leave room">&times;</button>
          </div>
        </div>

        <div id="sheet-container" class="sheet-container">
          <div id="sheet-backdrop" class="sheet-backdrop"></div>

          <div class="sheet-panel" id="sheet-teams" data-sheet="teams">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div class="team-panel team-red">
                <div class="team-head">
                  <span class="team-dot red"></span>
                  <h3 data-i18n="red_team">Red</h3>
                </div>
                <ul id="red-team-list" class="player-list"></ul>
                <div class="team-actions">
                  <button class="btn btn-team red" type="button" data-team="red" data-i18n="join_red">Join Red</button>
                  <div class="role-row">
                    <button class="btn btn-role" type="button" data-role="spymaster" data-role-team="red" data-i18n="spymaster">Spymaster</button>
                    <button class="btn btn-role" type="button" data-role="operative" data-role-team="red" data-i18n="operative">Operative</button>
                  </div>
                </div>
              </div>

              <div class="team-panel team-blue">
                <div class="team-head">
                  <span class="team-dot blue"></span>
                  <h3 data-i18n="blue_team">Blue</h3>
                </div>
                <ul id="blue-team-list" class="player-list"></ul>
                <div class="team-actions">
                  <button class="btn btn-team blue" type="button" data-team="blue" data-i18n="join_blue">Join Blue</button>
                  <div class="role-row">
                    <button class="btn btn-role" type="button" data-role="spymaster" data-role-team="blue" data-i18n="spymaster">Spymaster</button>
                    <button class="btn btn-role" type="button" data-role="operative" data-role-team="blue" data-i18n="operative">Operative</button>
                  </div>
                </div>
              </div>

              <div class="sidebar-actions">
                <button id="start-game-btn" class="btn btn-accent btn-lg hidden" type="button" data-i18n="start_game">Start Game</button>
                <button class="btn btn-ghost spectator-btn" type="button" data-role="spectator" data-i18n="spectator">Spectator</button>
                <button id="prune-btn" class="btn btn-ghost btn-sm hidden" type="button" data-i18n="prune_offline">Prune Offline</button>
              </div>
            </div>
          </div>

          <div class="sheet-panel" id="sheet-feed" data-sheet="feed">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div id="feed-entries" class="feed-entries"></div>
              <form id="chat-form" class="chat-form" autocomplete="off">
                <input id="chat-input" type="text" maxlength="200" placeholder="Type a message..." data-i18n-placeholder="chat_placeholder" />
                <button type="submit" class="btn btn-ghost btn-sm" data-i18n="send">Send</button>
              </form>
            </div>
          </div>

          <div class="sheet-panel" id="sheet-voice" data-sheet="voice">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div class="voice-controls">
                <button id="voice-join-btn" class="btn btn-primary voice-chat-btn" type="button">Voice</button>
                <div class="voice-toggles">
                  <button id="voice-mute-btn" class="btn btn-ghost voice-mute-btn hidden" type="button">Mute</button>
                  <button id="voice-noise-btn" class="btn btn-ghost voice-noise-btn hidden" type="button">Noise Off</button>
                </div>
              </div>
              <div id="voice-peer-list" class="voice-peer-list"></div>
            </div>
          </div>

          <div class="sheet-panel" id="sheet-settings" data-sheet="settings">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div class="settings-block settings-block-meta">
                <div class="room-meta">
                  <div id="qr-code-container" class="qr-wrap"></div>
                  <div id="room-seal-container" class="seal-wrap"></div>
                </div>
              </div>

              <div class="settings-block">
                <span class="settings-label" data-i18n="mode">Mode</span>
                <div class="mode-grid">
                  <button class="mode-btn" type="button" data-room-mode="casual" data-i18n="mode_casual">Casual</button>
                  <button class="mode-btn" type="button" data-room-mode="blitz" data-i18n="mode_blitz">Blitz</button>
                  <button class="mode-btn" type="button" data-room-mode="cipher" data-i18n="mode_cipher">Cipher</button>
                  <button class="mode-btn" type="button" data-room-mode="blackout" data-i18n="mode_blackout">Blackout</button>
                </div>
                <p id="mode-note" class="mode-note"></p>
              </div>

              <div class="settings-block">
                <div class="toggle-row">
                  <button id="sound-toggle-btn" class="toggle-btn" type="button" data-i18n="sound_on">
                    <span>Sound</span>
                  </button>
                  <button id="colorblind-toggle-btn" class="toggle-btn" type="button" data-i18n="colorblind_off">
                    <span>A11y</span>
                  </button>
                </div>
              </div>

              <div class="settings-block">
                <span class="settings-label" data-i18n="word_pack">Custom Words</span>
                <div class="pack-row">
                  <input id="word-pack-input" type="url" placeholder="https://..." class="input-sm" />
                  <button id="word-pack-btn" class="btn btn-ghost btn-sm" type="button" data-i18n="load">Load</button>
                </div>
              </div>

              <div class="settings-block">
                <div class="language-switch" role="group" aria-label="Language">
                  <button class="lang-btn" type="button" data-language="en" data-i18n="language_en">English</button>
                  <button class="lang-btn" type="button" data-language="tr" data-i18n="language_tr">Türkçe</button>
                </div>
              </div>
            </div>
          </div>

          <div class="sheet-panel" id="sheet-debrief" data-sheet="debrief">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div id="debrief-content" class="overlay-content"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="alert" aria-live="assertive"></div>

    <div id="confirm-overlay" class="overlay hidden">
      <div class="overlay-panel confirm-panel">
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-yes-btn" class="btn btn-primary" type="button" data-i18n="confirm_yes">Confirm</button>
          <button id="confirm-no-btn" class="btn btn-ghost" type="button" data-i18n="confirm_no">Cancel</button>
        </div>
      </div>
    </div>

    <div id="voice-audio-container" aria-hidden="true"></div>

    <script src="socket.io/socket.io.js"></script>
    <script src="translations.js?v=3"></script>
    <script type="module" src="app.js?v=3"></script>
  </body>
</html>
