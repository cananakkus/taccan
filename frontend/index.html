<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taccan</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Taccan</h1>
          <p>Realtime social deduction word game</p>
        </div>
        <div class="status-box">
          <span id="connection-dot" class="dot offline"></span>
          <span id="connection-label">Disconnected</span>
        </div>
      </header>

      <section id="join-panel" class="panel">
        <h2>Join or Create Room</h2>
        <label class="field">
          <span>Display name</span>
          <input id="name-input" type="text" maxlength="24" placeholder="Player name" />
        </label>

        <div class="join-row">
          <label class="field compact">
            <span>Room code</span>
            <input id="code-input" type="text" maxlength="4" placeholder="ABCD" />
          </label>
          <button id="join-btn" class="btn neutral">Join</button>
          <button id="create-btn" class="btn">Create</button>
        </div>

        <p id="join-note" class="hint-text">Use the same name to keep things recognizable in lobby.</p>
      </section>

      <section id="room-panel" class="panel hidden">
        <div class="room-head">
          <div>
            <p class="room-label">Room</p>
            <p id="room-code" class="room-code">----</p>
          </div>
          <div class="room-actions">
            <button id="copy-room-btn" class="btn subtle">Copy Code</button>
            <button id="leave-room-btn" class="btn subtle danger">Leave</button>
          </div>
        </div>

        <div id="turn-banner" class="turn-banner">Lobby open</div>

        <div class="layout">
          <aside class="sidebar">
            <h3>Players</h3>
            <ul id="player-list" class="player-list"></ul>

            <div class="control-group">
              <h4>Team</h4>
              <div class="button-row">
                <button class="btn small" data-team="red">Red</button>
                <button class="btn small" data-team="blue">Blue</button>
                <button class="btn small neutral" data-team="none">Spectator</button>
              </div>
            </div>

            <div class="control-group">
              <h4>Role</h4>
              <div class="button-row">
                <button class="btn small" data-role="spymaster">Spymaster</button>
                <button class="btn small" data-role="operative">Operative</button>
                <button class="btn small neutral" data-role="spectator">Spectator</button>
              </div>
            </div>

            <button id="start-game-btn" class="btn full">Start Game</button>

            <div class="scores">
              <p id="red-count" class="score red">Red: -</p>
              <p id="blue-count" class="score blue">Blue: -</p>
            </div>
          </aside>

          <main class="main">
            <section id="hint-section" class="action-box hidden">
              <h3>Submit Hint</h3>
              <form id="hint-form" class="hint-form">
                <input id="hint-word-input" type="text" maxlength="30" placeholder="One word" required />
                <input id="hint-count-input" type="number" min="0" max="9" value="1" required />
                <button type="submit" class="btn">Send Hint</button>
              </form>
            </section>

            <section id="guess-section" class="action-box hidden">
              <h3>Guessing Active</h3>
              <p id="hint-display" class="hint-display">Awaiting hint...</p>
              <button id="end-turn-btn" class="btn neutral">End Turn</button>
            </section>

            <section id="result-section" class="action-box hidden">
              <h3>Game Finished</h3>
              <p id="result-text"></p>
            </section>

            <div id="board" class="board"></div>
          </main>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
