name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/*.test.js

      - name: Deploy
        run: |
          rsync -a --delete --exclude node_modules --exclude .git ./ /opt/wleeaf/taccan/
          docker compose -f /opt/wleeaf/docker-compose.yml up -d --build taccan
