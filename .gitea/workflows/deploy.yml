name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/*.test.js

      - name: Build and deploy
        run: |
          docker build -t taccan .
          docker stop taccan || true
          docker rm taccan || true
          docker run -d \
            --name taccan \
            --network wleeaf_services \
            --restart unless-stopped \
            -e HOST=0.0.0.0 \
            taccan
